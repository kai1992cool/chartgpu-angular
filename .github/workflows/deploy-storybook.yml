name: Deploy Storybook to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      angular-major-versions:
        description: Angular major versions to publish, comma-separated. Leave blank for all versions.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        angular-version: ${{ fromJson(github.event.inputs.angular-major-versions == '' && '[18,19,20,21,22]' || format('[{0}]', join(github.event.inputs.angular-major-versions, ','))) }}
    steps:
      - name: Validate Angular versions input
        shell: python
        run: |
          import os
          import sys

          raw = os.environ.get('INPUT_ANGULAR_MAJOR_VERSIONS', '').strip()
          if not raw:
              sys.exit(0)

          allowed = {'18', '19', '20', '21', '22'}
          versions = [item.strip() for item in raw.split(',') if item.strip()]
          invalid = [item for item in versions if item not in allowed]

          if invalid:
              raise SystemExit(
                  f"Invalid angular-major-versions value(s): {', '.join(invalid)}. Allowed values are 18,19,20,21,22 or blank."
              )
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install latest npm
        run: npm install --global npm@latest

      - name: Apply Angular version dependencies
        run: node scripts/use-angular-version.mjs ${{ matrix.angular-version }}

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build Angular library
        run: npx ng build chartgpu-angular

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy this version to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/storybook/chartgpu-angular
          publish_branch: gh-pages
          destination_dir: v${{ matrix.angular-version }}
          keep_files: true

  deploy-demo-app:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install latest npm
        run: npm install --global npm@latest

      - name: Apply Angular 22 dependencies
        run: node scripts/use-angular-version.mjs 22

      - name: Install dependencies
        run: |
          npm install --no-package-lock --legacy-peer-deps
      - name: Build Angular demo app
        run: |
          npx ng build chartgpu-angular-demo --base-href --base-href /${{ github.event.repository.name }}/
          cp dist/chartgpu-angular-demo/browser/index.html dist/chartgpu-angular-demo/browser/404.html

      - name: Deploy Angular demo app to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/chartgpu-angular-demo/browser
          publish_branch: gh-pages
          keep_files: true
